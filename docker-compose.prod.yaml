services:
  travel_api:
    image: ghcr.io/travelindos/server-travel:${DOCKER_TAG:-staging}
    container_name: travel-api-${ENV_NAME:-staging}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:${PORT:-8002}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${ENV_NAME:-staging}
      - DATABASE_HOST=travel-mysql-${ENV_NAME:-staging}
      - DATABASE_PORT=3306
    depends_on:
      travel_mysql:
        condition: service_healthy
    networks:
      - travel-network

  travel_mysql:
    image: mysql:8.0
    container_name: travel-mysql-${ENV_NAME:-staging}
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-travel_db}
      MYSQL_USER: ${DATABASE_USER:-traveldb}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-traveldb}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - travel_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - travel-network

networks:
  travel-network:
    name: travel-network-${ENV_NAME:-staging}
    driver: bridge

volumes:
  travel_mysql_data:
    name: travel-mysql-data-${ENV_NAME:-staging}
